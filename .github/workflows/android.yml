name: Build

# Runs on pull requests and pushes to main, on a manual click in the Actions
# tab, and on every v* tag. A tag also publishes a GitHub Release with a signed
# release APK attached. Only Android is built; this client targets Android alone
# for now.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# The release job creates a release and uploads an asset.
permissions:
  contents: write

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A source file that is not tracked (say, hidden by a gitignore rule) is
      # simply absent from a fresh checkout, so the build emits an APK with no
      # app classes and it crashes on launch. Fail loudly here instead.
      - name: Verify app sources are tracked
        run: git ls-files --error-unmatch android/app/src/main/java/com/harmony/mobile/MainActivity.java

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # JDK 21, not newer: this project's Gradle wrapper cannot parse its build
      # scripts on JDK 25+ (it fails on Java 27 bytecode).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      # A debug APK is signed with the debug key, so it always installs as-is.
      # Every run produces one so there is something to sideload even without a
      # release tag.
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - uses: actions/upload-artifact@v7
        with:
          name: harmony-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # --- Signed release build, on a v* tag only ---------------------------

      # versionName comes from the tag (v0.2.0 -> 0.2.0); versionCode is derived
      # from it as major*10000 + minor*100 + patch so it always increases.
      - name: Derive version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "$version"
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch%%-*}"; patch="${patch:-0}"
          echo "HARMONY_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "HARMONY_VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - name: Decode the release keystore
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        run: ./gradlew assembleRelease -PversionName="$HARMONY_VERSION_NAME" -PversionCode="$HARMONY_VERSION_CODE"
        env:
          HARMONY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HARMONY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HARMONY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Name the release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: mv android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/harmony-mobile-${HARMONY_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: harmony-mobile-release-apk
          path: android/app/build/outputs/apk/release/harmony-mobile-*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: android
    # Only on a tag push; a manual run stops after building.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # The signed release APK only, not the debug one.
      - uses: actions/download-artifact@v8
        with:
          name: harmony-mobile-release-apk
          path: apk

      - uses: softprops/action-gh-release@v3
        with:
          files: apk/*.apk
          generate_release_notes: true
