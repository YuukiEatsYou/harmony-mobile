name: Build

# This workflow lives on the company fork (hrmnychat-hue/harmony-mobile) and runs
# there, not just in the canonical repository. Every push to any branch builds a
# **validation** debug APK and uploads it as a run artifact, so the upstream
# maintainer can download a ready-made build from our repository and test the
# pull request before merging it. Pushing a v* tag additionally builds a signed
# release APK.
#
# Every build this workflow publishes is a PREVIEW: the run summary is labeled
# and the release job publishes a GitHub prerelease titled and described as a
# preview build, because this client is not stable. Only Android is built; this
# client targets Android alone for now.
on:
  workflow_dispatch:
  push:
    # Every branch, not only main: a pull-request branch pushed to the fork gets
    # its own validation build there, which is what upstream downloads.
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

# The release job creates a release and uploads an asset.
permissions:
  contents: write

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A source file that is not tracked (say, hidden by a gitignore rule) is
      # simply absent from a fresh checkout, so the build emits an APK with no
      # app classes and it crashes on launch. Fail loudly here instead.
      - name: Verify app sources are tracked
        run: git ls-files --error-unmatch android/app/src/main/java/com/harmony/mobile/MainActivity.java

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # JDK 21, not newer: this project's Gradle wrapper cannot parse its build
      # scripts on JDK 25+ (it fails on Java 27 bytecode).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      # The validation build. A debug APK is signed with the debug key, so it
      # installs as-is on any device or emulator; upstream downloads this from
      # the fork's Actions run and needs no signing secrets to reproduce it.
      - name: Build validation APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload validation APK
        uses: actions/upload-artifact@v7
        with:
          name: harmony-mobile-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Make the preview status unmissable in the run UI, next to the artifact.
      - name: Label the run as a preview build
        if: always()
        run: |
          {
            echo "## :warning: Preview build - not a stable release"
            echo
            echo "This run built a Harmony Mobile **preview** APK for validation."
            echo
            echo "Download the \`harmony-mobile-preview-apk\` artifact attached to"
            echo "this run, unzip it, and install \`app-debug.apk\` on an Android"
            echo "device or emulator."
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Signed release build, on a v* tag only ---------------------------

      # versionName comes from the tag (v0.2.0 -> 0.2.0); versionCode is derived
      # from it as major*10000 + minor*100 + patch so it always increases.
      - name: Derive version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "$version"
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch%%-*}"; patch="${patch:-0}"
          echo "HARMONY_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "HARMONY_VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - name: Decode the release keystore
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        run: ./gradlew assembleRelease -PversionName="$HARMONY_VERSION_NAME" -PversionCode="$HARMONY_VERSION_CODE"
        env:
          HARMONY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HARMONY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HARMONY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Name the release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: mv android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/harmony-mobile-${HARMONY_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: harmony-mobile-release-apk
          path: android/app/build/outputs/apk/release/harmony-mobile-*.apk
          if-no-files-found: error

  release:
    name: Publish preview release
    needs: android
    # Only on a tag push; a manual run stops after building.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # The signed release APK only, not the debug one.
      - uses: actions/download-artifact@v8
        with:
          name: harmony-mobile-release-apk
          path: apk

      # Every release this client publishes is a preview. Mark it as a GitHub
      # prerelease (a prerelease can never be the repo's "Latest" release) and
      # put the same warning at the top of its title and body, so nobody
      # mistakes a verification build for a stable release.
      - uses: softprops/action-gh-release@v3
        with:
          name: 'Harmony Mobile ${{ github.ref_name }} (preview)'
          body: |
            > **Preview build — not a stable release.**
            >
            > This is a Harmony Mobile preview build for testing only. It is not a
            > stable or supported release: expect bugs and breaking changes, and do
            > not rely on it as the only copy of the app or its data.
          prerelease: true
          files: apk/*.apk
          generate_release_notes: true

  # A branch push (a pull-request branch on the fork) republishes a rolling
  # preview release under the `preview/<branch>` tag, so upstream has a stable,
  # login-free download URL for the validation build:
  #   https://github.com/hrmnychat-hue/harmony-mobile/releases/tag/preview/<branch>
  # The tag and release are GitHub prereleases and say "preview" everywhere.
  preview-release:
    name: Publish validation build
    needs: android
    # Branch pushes only. A v* tag goes through the signed release job above, and
    # a pull_request run has a read-only token and belongs to the base repository.
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: harmony-mobile-preview-apk
          path: apk

      - name: Name the validation APK
        run: mv apk/app-debug.apk "apk/harmony-mobile-preview-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: 'preview/${{ github.ref_name }}'
          target_commitish: ${{ github.sha }}
          name: 'Preview build: ${{ github.ref_name }}'
          body: |
            > **Preview build — not a stable release.**
            >
            > A Harmony Mobile preview APK built from `${{ github.ref_name }}` at
            > commit `${{ github.sha }}`. Download the APK below and install it on
            > an Android device or emulator to validate the pull request. This is
            > not a stable release.
          prerelease: true
          fail_on_unmatched_files: true
          files: apk/*.apk
